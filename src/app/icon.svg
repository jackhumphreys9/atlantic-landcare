<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    Browser-tab icon. A simplified version of the new logo's mark: the dark
    circular wave-swoosh with a bright green leaf crossing it. The full
    lockup's wordmark is dropped — same reasoning as before, it turns to mush
    below about 100px — but the icon itself is new, matching the rebrand.
  -->
  <rect width="64" height="64" rx="13" fill="#ffffff" />
  <circle cx="30" cy="32" r="21" fill="#072e1c" />
  <!-- wave cut through the dark circle -->
  <path
    d="M11 36c6 3 12 3 18-1s12-4 18-1"
    fill="none"
    stroke="#ffffff"
    stroke-width="3.2"
    stroke-linecap="round"
  />
  <path
    d="M13 43c6 2.5 12 2 17-1.5s11-3.5 17-1"
    fill="none"
    stroke="#ffffff"
    stroke-width="2.6"
    stroke-linecap="round"
    opacity="0.85"
  />
  <!-- leaf crossing the circle on the diagonal -->
  <path
    d="M22 46C20 34 27 23 41 16c2 13-3 24-15 30-2 1-3.3 0.8-4 0z"
    fill="#578d23"
  />
  <path d="M23 45c3-10 8-17 16-23" stroke="#3d6419" stroke-width="1.6" fill="none" stroke-linecap="round" />
</svg>
